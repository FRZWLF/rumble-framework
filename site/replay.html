<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipeline replay</title>
<meta name="description" content="Replays one issue's real pipeline trail — issue, triage, design, PR, reviews, fix rounds, gate — exported from GitHub by scripts/replay-from-gh.mjs.">
<style>
  :root { --bg:#faf8f6; --ink:#1d1a1b; --mute:#6b6266; --wine:#5c1a2e; --wine-2:#7d2a44; --teal:#0f4c5c; --teal-2:#1a6f82; --card:#fff; --line:#e6dfe1; --red:#b3261e; --yellow:#b7791f; --green:#2e7d32; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#141213; --ink:#f1ecee; --mute:#a59aa0; --card:#1e1b1c; --line:#332e30; --wine:#c9526f; --wine-2:#e07a95; --teal:#4fb3c9; --teal-2:#7fd0e0; } }
  :root[data-theme="dark"] { --bg:#141213; --ink:#f1ecee; --mute:#a59aa0; --card:#1e1b1c; --line:#332e30; --wine:#c9526f; --wine-2:#e07a95; --teal:#4fb3c9; --teal-2:#7fd0e0; }
  * { box-sizing:border-box }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:16px/1.5 -apple-system,"SF Pro Text",Inter,system-ui,sans-serif; overflow:hidden }
  header { position:fixed; inset:0 0 auto 0; padding:14px 16px; display:flex; gap:16px; align-items:center; background:var(--bg); border-bottom:1px solid var(--line); z-index:2 }
  header h1 { font-size:15px; margin:0; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  header h1 small { color:var(--mute); font-weight:400; margin-left:8px }
  .stepper { display:flex; gap:6px; margin-left:auto; flex-wrap:wrap }
  .stepper span { font-size:11px; letter-spacing:.06em; text-transform:uppercase; padding:4px 9px; border-radius:99px; border:1px solid var(--line); color:var(--mute); transition:all .4s }
  .stepper span.done { border-color:var(--teal); color:var(--teal) }
  .stepper span.now { background:var(--wine); border-color:var(--wine); color:#fff; transform:scale(1.06) }
  main { position:absolute; inset:64px 0 56px 0; overflow-y:auto; padding:24px 16px 120px; scroll-behavior:smooth }
  .rail { max-width:880px; margin:0 auto; position:relative; padding-left:34px }
  .rail::before { content:""; position:absolute; left:11px; top:0; bottom:0; width:2px; background:linear-gradient(var(--teal), var(--wine)); opacity:.35 }
  .ev { position:relative; margin:0 0 18px; opacity:0; transform:translateY(18px); transition:opacity .5s cubic-bezier(.2,.7,.2,1), transform .5s cubic-bezier(.2,.7,.2,1) }
  .ev.in { opacity:1; transform:none }
  .ev::before { content:""; position:absolute; left:-29px; top:14px; width:12px; height:12px; border-radius:50%; background:var(--teal); box-shadow:0 0 0 4px var(--bg) }
  .ev.k-issue::before,.ev.k-pr::before,.ev.k-merged::before { background:var(--wine) }
  .ev.k-review::before { background:var(--yellow) } .ev.k-review.red::before { background:var(--red) } .ev.k-review.clean::before { background:var(--green) }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 18px; box-shadow:0 8px 30px rgba(0,0,0,.05) }
  .meta { display:flex; gap:10px; align-items:baseline; font-size:12px; color:var(--mute); margin-bottom:6px; flex-wrap:wrap }
  .meta b { color:var(--ink); font-weight:600 } .kind { text-transform:uppercase; letter-spacing:.08em; font-size:10px; padding:2px 7px; border-radius:6px; background:var(--line) }
  .k-issue .kind,.k-pr .kind,.k-merged .kind { background:var(--wine); color:#fff } .k-review .kind,.k-fix-round .kind { background:var(--teal); color:#fff }
  .title { font-weight:600; font-size:17px; margin:0 0 6px }
  .verdict { display:inline-block; margin:6px 0 2px; padding:6px 12px; border-radius:8px; font-weight:600; font-size:14px; background:var(--line) }
  .verdict.red { background:var(--red); color:#fff } .verdict.yellow { background:var(--yellow); color:#fff } .verdict.clean { background:var(--green); color:#fff }
  .label { display:inline-block; font-size:12px; padding:2px 9px; border-radius:99px; border:1px solid var(--teal); color:var(--teal); margin:2px 4px 0 0 }
  details { margin-top:6px } summary { cursor:pointer; color:var(--teal-2); font-size:13px }
  .body { white-space:pre-wrap; font-size:14px; color:var(--ink); margin-top:8px; max-height:420px; overflow:auto; border-top:1px dashed var(--line); padding-top:8px }
  .body code,.body pre { font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace }
  .commit { font-family:ui-monospace,Menlo,monospace; font-size:13px }
  footer { position:fixed; inset:auto 0 0 0; padding:12px 16px; display:flex; gap:12px; align-items:center; justify-content:center; border-top:1px solid var(--line); background:var(--bg); font-size:13px; color:var(--mute) }
  footer button { font:inherit; padding:6px 14px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer }
  footer button.primary { background:var(--wine); border-color:var(--wine); color:#fff }
  .empty { max-width:720px; margin:12vh auto; padding:0 16px }
  .empty pre { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; overflow:auto; font-size:13px }
  @media (prefers-reduced-motion: reduce) { .ev { transition:none } }
</style>
</head>
<body>
<header><h1 id="h">Pipeline replay</h1><div class="stepper" id="stepper"></div></header>
<main><div class="rail" id="rail"></div></main>
<footer><button id="prev">← back</button><button id="next" class="primary">next event (space)</button><button id="auto">autoplay</button><span id="pos"></span></footer>
<script>
const STAGES = ['issue','triage','design','build','review','fix','gate','trail'];
const stageOf = e => ({ issue:'issue', labeled:'triage', unlabeled:'triage', triage:'triage', design:'design', pr:'build', commit:'build', review:'review', 'fix-round':'fix', merged:'gate', closed:'gate', trail:'trail', comment:'build' })[e.kind] || 'build';
const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const md = s => esc(s).replace(/```([\s\S]*?)```/g, '<pre>$1</pre>').replace(/`([^`\n]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
const verdictClass = v => !v ? '' : /🔴|\bRED\b|[1-9]\d* red/i.test(v) ? 'red' : /🟡|\bYELLOW\b|[1-9]\d* nit/i.test(v) ? 'yellow' : 'clean';
const params = new URLSearchParams(location.search);
const src = params.get('data');
const rail = document.getElementById('rail'), stepper = document.getElementById('stepper');
let events = [], i = 0, timer = null;

if (!src) {
  rail.innerHTML = `<div class="empty"><h2>No replay loaded</h2><p>This page animates the <em>real</em> trail of one issue. Export one first:</p>
  <pre>node scripts/replay-from-gh.mjs FRZWLF/requisit 12 > site/replays/issue-12.json
open "site/replay.html?data=replays/issue-12.json"</pre>
  <p>Every event is a GitHub object with its timestamp and author; nothing here is written by hand. Keys: space / → next, ← back, <b>a</b> autoplay, <b>t</b> theme.</p></div>`;
} else fetch(src).then(r => r.json()).then(d => {
  document.getElementById('h').innerHTML = `${esc(d.repo)} #${d.issue} <small>${esc(d.title)}</small>`;
  events = d.events.filter(e => !(e.kind === 'unlabeled')); // label removals are noise for a talk
  for (const e of events) rail.appendChild(card(e));
  STAGES.forEach(s => { const sp = document.createElement('span'); sp.textContent = s; sp.dataset.s = s; stepper.appendChild(sp); });
  i = Math.min(Number(location.hash.slice(1)) || 0, events.length); reveal();
});

function card(e) {
  const div = document.createElement('div');
  div.className = `ev k-${e.kind} ${verdictClass(e.verdict)}`;
  const when = new Date(e.at).toLocaleString(undefined, { dateStyle:'medium', timeStyle:'short' });
  let inner = `<div class="meta"><span class="kind">${esc(e.kind)}</span><b>${esc(e.who || '')}</b><span>${when}</span>${e.pr ? `<span>PR #${e.pr}</span>` : ''}</div>`;
  if (e.kind === 'labeled') inner += `<span class="label">${esc(e.text)}</span>`;
  else if (e.kind === 'commit') inner += `<div class="commit">${esc(e.sha)} ${esc(e.text)}</div>`;
  else {
    const first = (e.text || '').split('\n').find(l => l.trim()) || '';
    inner += `<p class="title">${md(e.kind === 'issue' || e.kind === 'pr' ? e.text : first.replace(/^#+\s*/, '').slice(0, 140))}</p>`;
    if (e.verdict) inner += `<div class="verdict ${verdictClass(e.verdict)}">${esc(e.verdict)}</div>`;
    const body = e.body || (e.kind !== 'issue' && e.kind !== 'pr' ? e.text : '');
    if (body && body.trim() && body.trim() !== first.trim()) inner += `<details><summary>full text</summary><div class="body">${md(body)}</div></details>`;
    if (e.url) inner += `<div class="meta" style="margin-top:6px"><a href="${esc(e.url)}" target="_blank" rel="noopener">open on GitHub</a></div>`;
  }
  div.innerHTML = `<div class="card">${inner}</div>`;
  return div;
}
function reveal() {
  [...rail.children].forEach((c, k) => c.classList.toggle('in', k < i));
  const cur = events[i - 1]; const st = cur ? stageOf(cur) : null;
  const seen = new Set(events.slice(0, i).map(stageOf));
  [...stepper.children].forEach(sp => { sp.classList.toggle('done', seen.has(sp.dataset.s) && sp.dataset.s !== st); sp.classList.toggle('now', sp.dataset.s === st); });
  document.getElementById('pos').textContent = events.length ? `${i} / ${events.length}` : '';
  if (cur) rail.children[i - 1].scrollIntoView({ block:'center', behavior:'smooth' });
  history.replaceState(null, '', `#${i}`);
}
const step = d => { i = Math.max(0, Math.min(events.length, i + d)); reveal(); };
document.getElementById('next').onclick = () => step(1);
document.getElementById('prev').onclick = () => step(-1);
const toggleAuto = () => { if (timer) { clearInterval(timer); timer = null; document.getElementById('auto').textContent = 'autoplay'; } else { timer = setInterval(() => { if (i >= events.length) toggleAuto(); else step(1); }, 1800); document.getElementById('auto').textContent = 'pause'; } };
document.getElementById('auto').onclick = toggleAuto;
addEventListener('keydown', ev => { if (ev.key === ' ' || ev.key === 'ArrowRight') { ev.preventDefault(); step(1); } else if (ev.key === 'ArrowLeft') step(-1); else if (ev.key === 'a') toggleAuto(); else if (ev.key === 't') document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; });
</script>
</body>
</html>
